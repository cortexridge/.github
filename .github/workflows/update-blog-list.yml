name: Update blog list on profile

# Keeps the writing section of the org profile in step with the site's RSS
# feed, so publishing a post is the only action required — the profile follows.
#
# Runs daily rather than on push because the source of truth is the deployed
# site, not this repository.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # lets you run it by hand right after publishing

permissions:
  contents: write

concurrency:
  group: update-blog-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the blog list from RSS
        run: python3 scripts/update_blog_list.py profile/README.md

      - name: Commit if anything changed
        run: |
          if [[ -z "$(git status --porcelain profile/README.md)" ]]; then
            echo "No change — profile already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "Update blog list from RSS"
          git push
